name: BinanceVoiceAgent
options:
  bundleIdPrefix: com.hackathon
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  BinanceVoiceAgent:
    type: application
    platform: iOS
    sources: [BinanceVoiceAgent]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hackathon.BinanceVoiceAgent
        INFOPLIST_FILE: BinanceVoiceAgent/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
